<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="icon" type="image/x-icon" href="Seven/windo-white.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Seven</title>
        <link rel="stylesheet" href="Seven/seven.css">
        <script src="Seven/seven.js" defer></script>
    </head>
    <body>
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Seven/static.mp4" type="video/mp4">
        </video>
        <div class="content-cluster">
            <img src="Seven/windo-white.png" class="windo-rotate"/>
            <div class="countdown-container" id="countdown-container">
                <div class="time-box">
                    <span id="days">00</span>
                    <div class="label">Days</div>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <div class="label">Hours</div>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <div class="label">Minutes</div>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <div class="label">Seconds</div>
                </div>
            </div>
        </div>
        <div class="video-section" id="video-section">
            <h2>Individual Uploads</h2>
            <div class="video-grid">
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/talkMTMMhqU" title="Interstellar +PLUS" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/dW4yCzVCb-4" title="With Someone New" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/8xdp_qV9GMQ" title="Oceanic Depths" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/7Y_BAaGa_FY" title="Orange-Shifted" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/euF0F98prbE" title="Airspace" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/mz81XS21_gk" title="Powerplexus" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/DdmzLxsMA4o" title="Circle of Insanity Revisited" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="video-card">
                    <iframe src="https://www.youtube.com/embed/YlHww5p845w" title="Megrims" frameborder="0" allowfullscreen></iframe>
                </div>

                    <iframe src="https://www.youtube.com/embed/GvKGijQjh_0" title="Gone Rogue VIP" frameborder="0" allowfullscreen></iframe>
